;[env:az-delivery-devkit-v4]
;platform = espressif32
;board = az-delivery-devkit-v4
;framework = arduino
;monitor_speed = 9600
[platformio]
default_envs = development

[env]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 9600
lib_deps =  adafruit/Adafruit SSD1306 @ 2.5.13
            adafruit/RTClib @ 2.1.4 



[env:development]
build_flags = -D BUILD_TYPE=1


[env:production]
build_flags = -D BUILD_TYPE=2